<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Squircle -->
  <rect x="14" y="14" width="472" height="472" rx="112" ry="112" fill="#BFE2FA" stroke="#16539E" stroke-width="22" stroke-linejoin="round" />
  
  <!-- Subtle Center Highlight -->
  <circle cx="250" cy="250" r="172" fill="#9BD0F6" opacity="0.65" />

  <!-- Signal / Spark Rays (Top Right) -->
  <line x1="345" y1="70" x2="341" y2="118" stroke="#F7A800" stroke-width="18" stroke-linecap="round" />
  <line x1="410" y1="90" x2="376" y2="132" stroke="#F7A800" stroke-width="18" stroke-linecap="round" />
  <line x1="440" y1="150" x2="400" y2="168" stroke="#F7A800" stroke-width="18" stroke-linecap="round" />

  <!-- Video Player Monitor Screen -->
  <rect x="56" y="150" width="284" height="200" rx="30" ry="30" fill="#FFFFFF" stroke="#16539E" stroke-width="20" stroke-linejoin="round" />

  <!-- Play Button (Rounded Triangle) -->
  <path d="M 160 186 C 160 177 170 172 178 177 L 244 220 C 251 224 251 236 244 240 L 178 283 C 170 288 160 283 160 274 Z" fill="#F7A800" stroke="#F7A800" stroke-width="8" stroke-linejoin="round" />

  <!-- Scrubber Bar & Knob -->
  <line x1="88" y1="316" x2="265" y2="316" stroke="#16539E" stroke-width="16" stroke-linecap="round" />
  <circle cx="134" cy="316" r="17" fill="#16539E" />

  <!-- Router Antennas (Pill with fill and stroke) -->
  <rect x="-10" y="-38" width="20" height="76" rx="10" transform="translate(296, 298) rotate(-5)" fill="#BFE2FA" stroke="#16539E" stroke-width="16" stroke-linejoin="round" />
  <rect x="-10" y="-38" width="20" height="76" rx="10" transform="translate(402, 298) rotate(6)" fill="#BFE2FA" stroke="#16539E" stroke-width="16" stroke-linejoin="round" />

  <!-- Router Body (Overlaps Video Screen) -->
  <rect x="258" y="324" width="180" height="76" rx="38" ry="38" fill="#BFE2FA" stroke="#16539E" stroke-width="20" stroke-linejoin="round" />

  <!-- Router Status LED Dots -->
  <circle cx="332" cy="362" r="9" fill="#F7A800" />
  <circle cx="361" cy="362" r="9" fill="#F7A800" />
  <circle cx="390" cy="362" r="9" fill="#F7A800" />
</svg>
