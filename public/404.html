<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Netora — Halaman Tidak Ditemukan (404)">
  <title>404 — Halaman Tidak Ditemukan | Netora</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/netora.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background gradient mesh */
    .bg-mesh-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(13, 91, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 210, 255, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(255, 122, 0, 0.04) 0%, transparent 50%);
    }

    /* Floating grid lines in background */
    .bg-grid-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: 
        linear-gradient(to right, rgba(226, 232, 240, 0.6) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(226, 232, 240, 0.6) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.7;
    }

    .error-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      padding: 32px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo Header */
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(13, 91, 255, 0.05);
      margin-bottom: 24px;
      animation: floatBadge 3.6s ease-in-out infinite;
    }

    .brand-logo-img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      object-fit: cover;
    }

    .brand-text {
      font-size: 13.5px;
      font-weight: 800;
      color: #1E293B;
      letter-spacing: -0.2px;
    }

    .brand-text span {
      color: #0D5BFF;
    }

    /* 404 Illustration with Animation */
    .illustration-box {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-ring-outer {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 2px dashed rgba(13, 91, 255, 0.25);
      animation: spinSlow 20s linear infinite;
    }

    .pulse-ring-middle {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(13, 91, 255, 0.12) 0%, rgba(0, 210, 255, 0.04) 70%, transparent 100%);
      animation: pulseGlow 2.5s ease-in-out infinite alternate;
    }

    .radar-icon-card {
      position: relative;
      z-index: 2;
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: linear-gradient(135deg, #0D5BFF 0%, #0077FE 50%, #00D2FF 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      box-shadow: 0 16px 36px rgba(13, 91, 255, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.4);
      animation: floatCard 4s ease-in-out infinite;
    }

    .radar-icon-card svg {
      width: 48px;
      height: 48px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.2));
    }

    /* Big 404 Typography */
    .error-code {
      font-size: 84px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -3px;
      margin: 0 0 10px;
      background: linear-gradient(135deg, #0D5BFF 0%, #00D2FF 50%, #FF7A00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 8px 16px rgba(13, 91, 255, 0.15));
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 800;
      background: #FEF2F2;
      color: #EF4444;
      border: 1px solid #FECACA;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 6px #EF4444;
      animation: blinkDot 1.4s ease-in-out infinite;
    }

    .error-title {
      font-size: 22px;
      font-weight: 800;
      color: #1E293B;
      margin: 0 0 10px;
      letter-spacing: -0.4px;
    }

    .error-desc {
      font-size: 13.5px;
      line-height: 1.6;
      color: #64748B;
      margin: 0 auto 28px;
      max-width: 380px;
    }

    /* Button Actions */
    .actions-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    @media (min-width: 480px) {
      .actions-row {
        flex-direction: row;
        max-width: 420px;
      }
    }

    .btn-action-primary {
      flex: 1;
      padding: 13px 20px;
      border-radius: 14px;
      background: #0D5BFF;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(13, 91, 255, 0.28);
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
      border: none;
      cursor: pointer;
    }

    .btn-action-primary:hover {
      background: #004BE6;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(13, 91, 255, 0.35);
    }

    .btn-action-primary:active {
      transform: translateY(1px);
    }

    .btn-action-secondary {
      flex: 1;
      padding: 13px 20px;
      border-radius: 14px;
      background: #FFFFFF;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1.5px solid #E2E8F0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-action-secondary:hover {
      border-color: #CBD5E1;
      background: #F8FAFC;
      color: #0F172A;
      transform: translateY(-2px);
    }

    .btn-action-secondary:active {
      transform: translateY(1px);
    }

    /* Footer Note */
    .footer-note {
      margin-top: 36px;
      font-size: 11.5px;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Keyframe Animations */
    @keyframes floatCard {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-8px) rotate(-1.5deg);
      }
    }

    @keyframes floatBadge {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(0.92);
        opacity: 0.6;
      }
      100% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    @keyframes spinSlow {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes blinkDot {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.3;
        transform: scale(0.85);
      }
    }
  </style>
</head>
<body>

  <div class="bg-mesh-glow"></div>
  <div class="bg-grid-lines"></div>

  <main class="error-container">

    <!-- Netora Brand Pill -->
    <div class="brand-pill">
      <img src="assets/logo.png" alt="Logo Netora" class="brand-logo-img" onerror="this.style.display='none'">
      <div class="brand-text">NET<span>ORA</span> PLATFORM</div>
    </div>

    <!-- Animated Radar Illustration -->
    <div class="illustration-box" aria-hidden="true">
      <div class="pulse-ring-outer"></div>
      <div class="pulse-ring-middle"></div>
      <div class="radar-icon-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" stroke-dasharray="2 2" stroke="rgba(255,255,255,0.7)"></line>
        </svg>
      </div>
    </div>

    <!-- Error Code & Status -->
    <div class="error-code">404</div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Akses Ditolak / Tidak Ditemukan</span>
    </div>

    <!-- Message -->
    <h1 class="error-title">Halaman Tidak Ditemukan</h1>
    <p class="error-desc">
      Alamat web yang Anda tuju tidak tersedia, telah dipindahkan, atau Anda tidak memiliki hak akses resmi untuk membukanya.
    </p>

    <!-- Call to Actions -->
    <div class="actions-row">
      <a href="beranda.html" class="btn-action-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Kembali ke Beranda</span>
      </a>
      <a href="login.html" class="btn-action-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span>Masuk ke Akun</span>
      </a>
    </div>

    <div class="footer-note">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span>Netora Security Firewall & Gateway © 2026</span>
    </div>

  </main>

</body>
</html>
