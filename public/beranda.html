<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Netora - Dashboard Pembelajaran Terpadu Jurusan Teknik Komputer dan Jaringan (TKJ), Cisco, MikroTik, dan Linux Server.">
  <title>Netora — Beranda Pembelajaran TKJ</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/netora.css?v=2026.33">
  <style>
    /* ===== Banner Hero Netora (Responsif HP & Desktop) ===== */
    .banner-carousel-wrap {
      position: relative;
      margin: 10px 14px 14px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(13, 91, 255, 0.12);
      background: linear-gradient(90deg, #254DFC 0%, #254DFC 50%, #FBC52D 50%, #FBC52D 100%);
      box-sizing: border-box;
    }
    .banner-carousel-track {
      display: flex;
      width: 100%;
    }
    .banner-slide {
      min-width: 100%;
      flex-shrink: 0;
      aspect-ratio: 2 / 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .banner-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center center;
    }
    @media (min-width: 768px) {
      .banner-carousel-wrap {
        margin: 18px 24px 16px;
        border-radius: 22px;
        box-shadow: 0 8px 30px rgba(13, 91, 255, 0.14);
      }
      .banner-slide {
        aspect-ratio: 2 / 1;
        max-height: 380px;
      }
    }
    @media (min-width: 992px) {
      .banner-carousel-wrap {
        max-width: 1024px;
        margin: 24px auto 18px;
        border-radius: 26px;
        box-shadow: 0 10px 36px rgba(13, 91, 255, 0.15);
      }
      .banner-slide {
        aspect-ratio: 2 / 1;
        max-height: 480px;
      }
    }

    /* ===== 4 Menu Utama Fitur (Simetris, Jernih & Elegan) ===== */
    .menu-features-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 0 14px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .feature-menu-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 12px 6px 10px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 2px 10px rgba(13, 91, 255, 0.04);
      border: 1.5px solid #E2E8F0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
      cursor: pointer;
    }

    .feature-menu-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(13, 91, 255, 0.12);
      border-color: #0D5BFF;
    }

    .feature-menu-card:active {
      transform: scale(0.97);
    }

    .feature-icon-wrapper {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      flex-shrink: 0;
      background: transparent;
      position: relative;
    }

    .feature-icon-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.25s ease;
      image-rendering: -webkit-optimize-contrast;
    }

    .feature-menu-card:hover .feature-icon-img {
      transform: scale(1.06);
    }

    .feature-card-title {
      margin: 0;
      font-size: 11.5px;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.25;
      letter-spacing: -0.2px;
    }

    @media (min-width: 768px) {
      .menu-features-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        padding: 0 24px;
        margin-bottom: 28px;
      }
      .feature-menu-card {
        padding: 18px 12px 16px;
        border-radius: 20px;
      }
      .feature-icon-wrapper {
        width: 52px;
        height: 52px;
        margin-bottom: 10px;
      }
      .feature-card-title {
        font-size: 13.5px;
      }
    }

    @media (min-width: 992px) {
      .menu-features-grid {
        max-width: 1380px;
        margin: 0 auto 36px !important;
        grid-template-columns: repeat(4, 1fr) !important;
        gap: 20px;
        padding: 0 36px;
      }
      .feature-menu-card {
        padding: 22px 14px 18px;
        border-radius: 22px;
      }
      .feature-icon-wrapper {
        width: 60px;
        height: 60px;
        margin-bottom: 12px;
      }
      .feature-card-title {
        font-size: 14.5px;
        letter-spacing: -0.3px;
      }
    }
  </style>
</head>
<body style="background:#F4F7FC; margin:0; padding:0;">

    <!-- ====== BANNER HERO NETORA ====== -->
    <div class="banner-carousel-wrap">

        <div class="banner-slide">
          <img src="assets/banner-netora.jpg?v=2026.33" alt="Netora - Aplikasi Belajar TKJ Berbasis Digital" class="banner-img" loading="eager">
        </div>
      </div>
    </div>

    <!-- Judul Bagian: Menu Utama -->
    <div class="section-header-orange">Menu Utama Pembelajaran</div>

    <!-- 4 Kolom Grid Menu Utama Fitur (Materi, Vidio Praktik, Kuis, Kalkulator IP) -->
    <div class="menu-features-grid">
      
      <!-- 1. Modul Materi (Paling Kiri) -->
      <a href="materi.html" class="feature-menu-card menu-card" id="card-menu-materi" title="Modul Materi Praktikum & Teori TKJ">
        <div class="feature-icon-wrapper">

        <div class="feature-icon-wrapper">
          <img src="assets/icon-quiz-beranda.png?v=2026.33" alt="Kuis Kompetensi" class="feature-icon-img" loading="eager">
        </div>

      <!-- 4. Kalkulator IP (Paling Kanan) -->
      <a href="kalkulator.html" class="feature-menu-card menu-card" id="card-menu-kalkulator" title="Kalkulator Subnetting IP Real-time">
        <div class="feature-icon-wrapper">

        </div>
        <h4 class="feature-card-title">Kalkulator IP</h4>

    </div>

    <!-- Bottom Navigation Bar Putih Bersih (4 Menu Sesuai Mockup) -->
    <nav class="app-bottom-nav-white" aria-label="Navigasi Utama">
      <!-- 1. Beranda (Active) -->
      <a href="beranda.html" class="nav-tab-item active">
        <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>

      <!-- 2. Progress / Nilai -->

        <span>Progress</span>

      <!-- 3. Notifikasi -->
      <a href="pengumuman.html" class="nav-tab-item">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span class="nav-notif-dot"></span>
        <span>Notifikasi</span>
      </a>

      <!-- 4. Profil -->
      <a href="profil.html" class="nav-tab-item">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profil</span>
      </a>

  </div>
