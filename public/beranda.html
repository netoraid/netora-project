  <style>
    /* ===== Banner Carousel ===== */
    .banner-carousel-wrap {
      position: relative;
      margin: 10px 14px 8px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    }
    .banner-carousel-track {
      display: flex;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .banner-slide {
      min-width: 100%;
      flex-shrink: 0;
      height: 150px;       /* Tinggi tetap di mobile */
      overflow: hidden;
    }
    .banner-img {
      width: 100%;
      height: 100%;        /* Isi penuh slot */
      display: block;
      object-fit: cover;   /* Crop tengah, tidak stretch */
      object-position: center center;
    }
    .banner-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
    }
    .banner-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: all 0.25s;
    }
    .banner-dot.active {
      width: 22px;
      border-radius: 4px;
      background: #FFFFFF;
    }
    /* Tablet & Desktop: banner lebih tinggi & selaras dengan margin 28px */
    @media (min-width: 768px) {
      .banner-carousel-wrap {
        margin: 18px 24px 12px;
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      }
      .banner-slide {
        height: 230px;
      }
      .banner-dots {
        bottom: 12px;
        gap: 8px;
      }
      .banner-dot {
        width: 8px;
        height: 8px;
      }
      .banner-dot.active {
        width: 26px;
      }
    }
    @media (min-width: 992px) {
      .banner-carousel-wrap {
        max-width: 1380px;
        margin: 24px auto 14px;
        border-radius: 24px;
      }
      .banner-slide {
        height: 280px;
      }
    }
    @media (min-width: 1200px) {
      .banner-slide {
        height: 320px;
      }
    }

    /* ===== 3 Menu Utama Fitur (Simetris, Jernih & Elegan) ===== */
    .menu-features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 14px;
      margin-bottom: 28px;
      box-sizing: border-box;
    }

    .feature-menu-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 16px 8px 14px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 4px 18px rgba(13, 91, 255, 0.05);
      border: 1.5px solid #E2E8F0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
      cursor: pointer;
    }

    .feature-menu-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(13, 91, 255, 0.14);
      border-color: #0D5BFF;
    }

    .feature-menu-card:active {
      transform: scale(0.97);
    }

    .feature-icon-wrapper {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      flex-shrink: 0;
      background: transparent;
    }

    .feature-icon-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.25s ease;
      image-rendering: -webkit-optimize-contrast;
    }

    .feature-menu-card:hover .feature-icon-img {
      transform: scale(1.06);
    }

    .feature-card-title {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.25;
      letter-spacing: -0.2px;
    }

    @media (min-width: 768px) {
      .menu-features-grid {
        gap: 18px;
        padding: 0 24px;
      }
      .feature-menu-card {
        padding: 22px 14px 18px;
        border-radius: 22px;
      }
      .feature-icon-wrapper {
        width: 70px;
        height: 70px;
        margin-bottom: 12px;
      }
      .feature-card-title {
        font-size: 15px;
      }
    }

    @media (min-width: 992px) {
      .menu-features-grid {
        max-width: 1380px;
        margin: 0 auto 36px !important;
        gap: 24px;
        padding: 0 36px;
      }
      .feature-menu-card {
        padding: 28px 18px 24px;
        border-radius: 24px;
      }
      .feature-icon-wrapper {
        width: 84px;
        height: 84px;
        margin-bottom: 14px;
      }
      .feature-card-title {
        font-size: 17px;
        letter-spacing: -0.3px;
      }
    }
  </style>
</head>
