<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Netora - Platform Pembelajaran Teknik Komputer dan Jaringan (TKJ). Masuk atau daftar untuk mulai belajar.">
  <title>Netora — Platform Belajar TKJ</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/netora.css?v=2026.21">
  <style>
    /* ===================================================
       NETORA AUTH SYSTEM (FOCUSED LOGIN & REGISTER)
    =================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0 !important;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #F8FAFC;
      color: #0F172A;
      overflow-x: hidden;
    }

    /* Ambient background layer */
    .netora-bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 18%, rgba(13, 91, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 88% 82%, rgba(255, 122, 0, 0.10) 0%, transparent 40%),
        #F8FAFC;
    }

    /* Outer layout container */
    .page-main-container {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      box-sizing: border-box;
    }

    /* Focused Auth Card Shell */
    .auth-card-shell {
      width: 100%;
      max-width: 460px;
      background: #FFFFFF;
      border-radius: 26px;
      border: 1.5px solid #E2E8F0;
      box-shadow: 0 20px 50px -10px rgba(15, 23, 42, 0.08), 0 0 1px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      margin: auto;
      padding: 38px 34px 34px;
      transition: all 0.25s ease;
      box-sizing: border-box;
    }

    /* Mobile Adaptivity */
    @media (max-width: 500px) {
      .page-main-container {
        padding: 0;
        align-items: stretch;
      }
      .auth-card-shell {
        border-radius: 0;
        border: none;
        box-shadow: none;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 36px 20px max(28px, env(safe-area-inset-bottom, 28px));
        justify-content: center;
      }
    }

    /* Logo & Header */
    .auth-brand-header {
      text-align: center;
      margin-bottom: 22px;
    }
    .auth-brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      box-shadow: 0 4px 14px rgba(13, 91, 255, 0.08);
    }
    .auth-brand-logo img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .auth-brand-title {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #0F172A;
      line-height: 1.1;
    }
    .auth-brand-title span {
      color: #0D5BFF;
    }
    .auth-brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: #64748B;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Segmented Tab Switcher */
    .auth-tab-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #F1F5F9;
      border: 1.5px solid #E2E8F0;
      border-radius: 16px;
      padding: 4px;
      gap: 6px;
      margin-bottom: 22px;
      box-sizing: border-box;
    }
    .auth-tab-btn {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      background: transparent;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #64748B;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      touch-action: manipulation;
    }
    .auth-tab-btn:hover:not(.active) {
      color: #0F172A;
      background: rgba(255, 255, 255, 0.5);
    }
    .auth-tab-btn.active.tab-login {
      background: #0D5BFF;
      color: #FFFFFF;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(13, 91, 255, 0.28);
    }
    .auth-tab-btn.active.tab-register {
      background: #FF7A00;
      color: #FFFFFF;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(255, 122, 0, 0.28);
    }

    /* In-card Error Banner */
    .auth-error-banner {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      background: #FEF2F2;
      border: 1.5px solid #FECACA;
      border-radius: 14px;
      color: #DC2626;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 18px;
      animation: fadeIn 0.2s ease-out;
    }

    /* Form Fields */
    .auth-form-body {
      width: 100%;
    }
    .form-header-meta {
      margin-bottom: 18px;
    }
    .form-title {
      font-size: 18px;
      font-weight: 800;
      color: #0F172A;
      margin: 0;
      letter-spacing: -0.2px;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group:last-of-type {
      margin-bottom: 22px;
    }
    .form-label {
      display: block;
      font-size: 11.5px;
      font-weight: 800;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 7px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94A3B8;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Crucial: 16px font-size prevents mobile auto-zoom on iOS & Android */
    .form-input {
      width: 100%;
      height: 50px;
      background: #F8FAFC;
      border: 1.5px solid #CBD5E1;
      border-radius: 14px;
      padding: 0 46px 0 44px;
      font-size: 16px !important;
      font-family: inherit;
      color: #0F172A;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
      -webkit-appearance: none;
    }
    .form-input::placeholder {
      color: #94A3B8;
      font-size: 14px;
    }
    .form-input:focus {
      background: #FFFFFF;
      border-color: #0D5BFF;
      box-shadow: 0 0 0 3px rgba(13, 91, 255, 0.16);
    }
    .form-input.focus-orange:focus {
      border-color: #FF7A00;
      box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.16);
    }

    /* Eye toggle button */
    .btn-pwd-eye {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background: transparent;
      border: none;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94A3B8;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .btn-pwd-eye:hover, .btn-pwd-eye:active {
      color: #334155;
      background: rgba(0, 0, 0, 0.05);
    }

    /* Submit Button */
    .btn-submit-action {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 14px;
      font-size: 15.5px;
      font-weight: 800;
      color: #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      letter-spacing: 0.2px;
      touch-action: manipulation;
      box-sizing: border-box;
    }
    .btn-submit-action.btn-blue {
      background: linear-gradient(135deg, #0D5BFF 0%, #2563EB 100%);
      box-shadow: 0 8px 24px rgba(13, 91, 255, 0.32);
    }
    .btn-submit-action.btn-blue:hover {
      box-shadow: 0 12px 28px rgba(13, 91, 255, 0.42);
      transform: translateY(-1px);
    }
    .btn-submit-action.btn-orange {
      background: linear-gradient(135deg, #FF7A00 0%, #EA580C 100%);
      box-shadow: 0 8px 24px rgba(255, 122, 0, 0.32);
    }
    .btn-submit-action.btn-orange:hover {
      box-shadow: 0 12px 28px rgba(255, 122, 0, 0.42);
      transform: translateY(-1px);
    }
    .btn-submit-action:active {
      transform: scale(0.98) !important;
    }

    /* Switch mode helper text */
    .auth-toggle-hint {
      text-align: center;
      font-size: 13px;
      color: #64748B;
      margin-top: 18px;
      margin-bottom: 0;
    }
    .auth-toggle-link {
      font-weight: 700;
      text-decoration: none;
      padding: 4px 6px;
      display: inline-block;
      cursor: pointer;
    }
    .auth-toggle-link.blue { color: #0D5BFF; }
    .auth-toggle-link.orange { color: #FF7A00; }
    .auth-toggle-link:hover { text-decoration: underline; }

    /* Transitions */
    .fade-panel {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Ambient background -->
  <div class="netora-bg-mesh"></div>

  <!-- Page Main Container -->
  <div class="page-main-container">

    <!-- AUTH SCREEN (MASUK & DAFTAR SISWA) -->
    <div id="auth-view" class="auth-card-shell fade-panel">

      <!-- Brand Logo Header -->
      <div class="auth-brand-header">
        <div class="auth-brand-logo">
          <img src="assets/logo.png" alt="Netora Logo">
        </div>
        <h1 class="auth-brand-title">Net<span>ora</span></h1>
        <div class="auth-brand-sub">PORTAL PEMBELAJARAN TKJ</div>
      </div>

      <!-- Segmented Tab Switcher (Masuk / Daftar Siswa) -->
      <div class="auth-tab-group" role="tablist">
        <button id="tab-btn-login" type="button" class="auth-tab-btn active tab-login" role="tab" aria-selected="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Masuk</span>
        </button>
        <button id="tab-btn-register" type="button" class="auth-tab-btn" role="tab" aria-selected="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          <span>Daftar Siswa</span>
        </button>
      </div>

      <!-- In-card Alert Error Banner -->
      <div id="alert-error" class="auth-error-banner" role="alert"></div>

      <!-- TAB PANEL 1: MASUK (LOGIN) -->
      <div id="panel-login" class="auth-form-body fade-panel">
        <div class="form-header-meta">
          <h3 class="form-title">Selamat Datang Kembali</h3>
        </div>

        <form id="form-login" novalidate autocomplete="on">
          <div class="form-group">
            <label for="email" class="form-label">Email atau Username</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input type="text" id="email" class="form-input" placeholder="nama@email.com atau username" required autocomplete="username" inputmode="email">
            </div>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Kata Sandi</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="btn-pwd-eye" onclick="togglePasswordVisibility('password', this)" title="Lihat/Sembunyikan kata sandi" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" id="btn-submit-login" class="btn-submit-action btn-blue">
            <span>Masuk Sekarang</span>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </form>

        <p class="auth-toggle-hint" style="margin-top: 18px;">
          Belum memiliki akun siswa?
          <a href="#" onclick="switchAuthTab('register'); return false;" class="auth-toggle-link orange">Daftar Akun Baru</a>
        </p>
      </div>


      <!-- TAB PANEL 2: DAFTAR SISWA (REGISTER) -->
      <div id="panel-register" class="auth-form-body fade-panel" style="display: none;">
        <div class="form-header-meta">
          <h3 class="form-title">Pendaftaran Siswa Baru</h3>
        </div>

        <form id="form-register" novalidate autocomplete="on">
          <div class="form-group">
            <label for="reg-nama" class="form-label">Nama Lengkap Siswa</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input type="text" id="reg-nama" class="form-input focus-orange" placeholder="Contoh: Muhammad Rizky" required autocomplete="name">
            </div>
          </div>

          <div class="form-group">
            <label for="reg-email" class="form-label">Alamat Email</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </span>
              <input type="email" id="reg-email" class="form-input focus-orange" placeholder="rizky@siswa.smk.sch.id" required autocomplete="email" inputmode="email">
            </div>
          </div>

          <div class="form-group">
            <label for="reg-password" class="form-label">Kata Sandi (Min. 6 Karakter)</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" id="reg-password" class="form-input focus-orange" placeholder="••••••••" required autocomplete="new-password">
              <button type="button" class="btn-pwd-eye" onclick="togglePasswordVisibility('reg-password', this)" title="Lihat/Sembunyikan kata sandi" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" id="btn-submit-register" class="btn-submit-action btn-orange">
            <span>Buat Akun Siswa</span>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </form>

        <p class="auth-toggle-hint">
          Sudah memiliki akun?
          <a href="#" onclick="switchAuthTab('login'); return false;" class="auth-toggle-link blue">Masuk Sekarang</a>
        </p>
      </div>

    </div><!-- /auth-card-shell -->

  </div><!-- /page-main-container -->

  <!-- Scripts -->
  <script src="js/netora.js?v=2026.21"></script>
  <script src="js/auth.js?v=2026.21"></script>
  <script>
    // ===== Password Visibility Toggle =====
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
      } else {
        input.type = 'password';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      }
    }

    // ===== Tab Switcher (Masuk <-> Daftar Siswa) =====
    const tabBtnLogin = document.getElementById('tab-btn-login');
    const tabBtnReg = document.getElementById('tab-btn-register');
    const panelLogin = document.getElementById('panel-login');
    const panelReg = document.getElementById('panel-register');
    const alertError = document.getElementById('alert-error');

    function switchAuthTab(mode, skipFocus = false) {
      if (alertError) {
        alertError.textContent = '';
        alertError.style.display = 'none';
      }

      if (mode === 'register') {
        if (tabBtnLogin) {
          tabBtnLogin.classList.remove('active', 'tab-login');
          tabBtnLogin.setAttribute('aria-selected', 'false');
        }
        if (tabBtnReg) {
          tabBtnReg.classList.add('active', 'tab-register');
          tabBtnReg.setAttribute('aria-selected', 'true');
        }

        if (panelLogin) panelLogin.style.display = 'none';
        if (panelReg) {
          panelReg.style.display = 'block';
          panelReg.classList.remove('fade-panel');
          void panelReg.offsetWidth;
          panelReg.classList.add('fade-panel');
        }

        const f = document.getElementById('reg-nama');
        if (f && !skipFocus) setTimeout(() => f.focus(), 140);
      } else {
        if (tabBtnReg) {
          tabBtnReg.classList.remove('active', 'tab-register');
          tabBtnReg.setAttribute('aria-selected', 'false');
        }
        if (tabBtnLogin) {
          tabBtnLogin.classList.add('active', 'tab-login');
          tabBtnLogin.setAttribute('aria-selected', 'true');
        }

        if (panelReg) panelReg.style.display = 'none';
        if (panelLogin) {
          panelLogin.style.display = 'block';
          panelLogin.classList.remove('fade-panel');
          void panelLogin.offsetWidth;
          panelLogin.classList.add('fade-panel');
        }

        const f = document.getElementById('email');
        if (f && !skipFocus) setTimeout(() => f.focus(), 140);
      }
    }

    window.switchAuthTab = switchAuthTab;

    if (tabBtnLogin) tabBtnLogin.addEventListener('click', () => switchAuthTab('login'));
    if (tabBtnReg) tabBtnReg.addEventListener('click', () => switchAuthTab('register'));

    // Auto-detect URL parameter
    (function initFromUrl() {
      const p = new URLSearchParams(window.location.search);
      const tab = p.get('tab') || p.get('action');

      if (tab === 'register') {
        switchAuthTab('register', true);
      } else {
        switchAuthTab('login', true);
      }
    })();
  </script>
</body>
</html>
