<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Netora — Pengumuman dan Informasi Praktikum TKJ.">
  <title>Netora — Notifikasi & Pengumuman</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/netora.css?v=2026.34">
</head>
<body style="background:#E2E8F0; margin:0; padding:0;">

  <div class="netora-mobile-app">

    <!-- Top Status Bar & Header Biru Royal -->
    <header class="app-top-header-royal">

      <div class="subpage-header-row">
        <div style="display:flex; align-items:center; gap:12px;">
          <a href="beranda.html" class="subpage-back-btn" title="Kembali ke Beranda">
            <svg style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </a>
          <h2 class="subpage-title" style="text-align:left;">Notifikasi</h2>
        </div>

        <!-- Menu Navigasi Desktop -->
        <nav class="desktop-top-nav-links">
          <a href="beranda.html" class="desktop-nav-link">
            <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Beranda</span>
          </a>
          <a href="progres.html" class="desktop-nav-link">
            <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            <span>Progress</span>
          </a>
          <a href="pengumuman.html" class="desktop-nav-link active">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span>Notifikasi</span>
          </a>
          <a href="profil.html" class="desktop-nav-link">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profil</span>
          </a>
        </nav>

        <div class="subpage-action-btn" title="Pusat Pemberitahuan">
          <svg style="width:17px; height:17px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>
      </div>
    </header>

    <!-- Container Daftar Pengumuman / Notifikasi -->
    <div id="pengumuman-container">
      <!-- Skeleton Loading Shimmer (Elegan Tanpa Spinner Tengah) -->
      <div class="desktop-grid-2col">
        <div class="skeleton-notif-card">
          <div class="skeleton-notif-header">
            <div class="netora-skeleton" style="width:72px; height:18px; border-radius:6px;"></div>
            <div class="netora-skeleton" style="width:96px; height:13px; border-radius:4px;"></div>
          </div>
          <div class="netora-skeleton skeleton-line h-18 w-75" style="margin-top:4px;"></div>
          <div class="netora-skeleton skeleton-line w-100"></div>
          <div class="netora-skeleton skeleton-line w-60"></div>
        </div>
        <div class="skeleton-notif-card">
          <div class="skeleton-notif-header">
            <div class="netora-skeleton" style="width:84px; height:18px; border-radius:6px;"></div>
            <div class="netora-skeleton" style="width:90px; height:13px; border-radius:4px;"></div>
          </div>
          <div class="netora-skeleton skeleton-line h-18 w-90" style="margin-top:4px;"></div>
          <div class="netora-skeleton skeleton-line w-100"></div>
          <div class="netora-skeleton skeleton-line w-40"></div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Bar Putih Bersih -->
    <nav class="app-bottom-nav-white" aria-label="Navigasi Utama">
      <a href="beranda.html" class="nav-tab-item">
        <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Beranda</span>

      <a href="progres.html" class="nav-tab-item">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        <span>Progress</span>
      </a>
      <a href="pengumuman.html" class="nav-tab-item active">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span class="nav-notif-dot"></span>
        <span>Notifikasi</span>
      </a>
      <a href="profil.html" class="nav-tab-item">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profil</span>
      </a>
    </nav>

  </div>

  <script src="js/netora.js?v=2026.34"></script>
  <script src="js/pengumuman.js?v=2026.34"></script>
</body>
</html>
